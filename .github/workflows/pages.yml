# 網頁版（web/）部署到 GitHub Pages，並定期更新全台實價登錄資料。
#
# 第一次使用：到 GitHub 專案的 Settings → Pages，Source 選「GitHub Actions」。
# 觸發：push 到 main、每月 2/12/22 日排程（內政部 1、11、21 日發布）、或在 Actions 頁面手動按 Run workflow。
# 實際的資料更新步驟都在 tools/ci.sh（之後改流程只要改那個檔，不用動這個檔）：
#   鄉鎮清單 → 情資 → 全台實價登錄 → 道路位置（逐步補抓）→ 資料檢查 → 整理紀錄
# 紀錄：web/data/status.json（網站「☰ → 問題回報」看得到）、logs/ci/latest.md（存回專案，git pull 後本機也有）；
# 有步驟失敗會自動在 GitHub 開 Issue（標籤「自動回報」），GitHub 會寄信通知。
name: 網頁版部署與資料更新

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 2,12,22 * *"     # UTC 01:17 = 台灣 09:17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: read        # 部署重試前查有沒有較新的執行

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy
      # 下載快取：分成「還原」與「儲存」兩步，儲存放在最後而且一定執行，
      # 這樣某一步失敗或逾時，這次已經下載的資料也會留給下一次用（不用整個重抓）
      - name: 還原全國實價登錄下載快取
        uses: actions/cache/restore@v4
        with:
          path: data/cache/plvr_tw
          key: plvr-tw-${{ github.run_id }}
          restore-keys: plvr-tw-
      - name: 更新資料（tools/ci.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci.sh "${{ github.event_name }}"
      # 診斷用的明細檔（租賃解析、捷運路線、人口欄位）不放上網站，改存成這次執行的附件（Actions 頁面可下載，保留 30 天）
      - name: 收起診斷檔
        if: always()
        run: |
          mkdir -p diag
          for f in rent_report.json transit_report.json pop_probe.json; do [ -f "web/data/tw/$f" ] && mv "web/data/tw/$f" diag/ || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: diag
          if-no-files-found: ignore
          retention-days: 30
      # 先上傳這次產生的網站，再做下面的 git pull／push：pull 遇到衝突時，衝突標記不會跟著部署出去
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: 把鄉鎮清單、道路位置、執行紀錄存回專案
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/tw/towns.json web/data/tw/*/roads logs/ci/latest.md logs/ci/history 2>/dev/null || true
          git diff --cached --quiet || git commit -m "資料更新紀錄與道路位置（$(date +%Y-%m-%d)）"
          git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          git push || echo "存回專案失敗（可能同時有人 push），下次再存"
      - name: 儲存全國實價登錄下載快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/plvr_tw
          key: plvr-tw-${{ github.run_id }}
  deploy:
    # GitHub Pages 偶爾卡在排隊或同步檔案而逾時（不是網站的問題）：失敗就等 1 分鐘再試一次。
    # 重試前先看有沒有更新的部署已經開始，有的話交給它，免得舊版本蓋掉新版本。
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: newer
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 60
          N=$(gh run list --workflow pages.yml --limit 20 --json databaseId --jq '[.[] | select(.databaseId > ${{ github.run_id }})] | length')
          echo "count=${N:-0}" >> "$GITHUB_OUTPUT"
          if [ "${N:-0}" != "0" ]; then echo "已經有較新的部署，交給它，不重試"; fi
      - id: retry
        if: steps.deployment.outcome == 'failure' && steps.newer.outputs.count == '0'
        uses: actions/deploy-pages@v4
  cloudflare:
    # 同一份網站另外送一份到 Cloudflare Pages（網址 <專案名>.pages.dev）。
    # 要在 GitHub → Settings → Secrets and variables → Actions 設好 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID 才會執行；
    # 專案名稱用變數 CF_PAGES_PROJECT（沒設就用 twhouse）。失敗不影響 GitHub Pages。
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'twhouse' }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        name: 部署到 Cloudflare Pages
        run: |
          mkdir site && tar -xf artifact/artifact.tar -C site
          npx -y wrangler@3.114.0 pages project create "$PROJECT" --production-branch main 2>/dev/null || true   # 第一次自動建立專案；已存在就略過
          npx -y wrangler@3.114.0 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
  report:
    # 建置或部署失敗（例如 ci.sh 以外的步驟出錯）時也開 Issue 通知
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create 自動回報 --color d93f0b --description "GitHub Actions 自動回報的錯誤" --force || true
          MSG="建置或部署失敗（$(date +%Y-%m-%d)），執行紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --label 自動回報 --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$MSG"; else gh issue create --label 自動回報 --title "自動回報：部署失敗" --body "$MSG"; fi
