<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="copyright" content="程式與設計 © 全台房價即時動態分析">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d57">
<meta name="description" content="台灣房價分析：全台各縣市、鄉鎮與路段的實價登錄行情、3D 地圖、重大建設時程、通勤與周邊設施。所有計算都在你的裝置上完成。">
<title>台灣房價分析</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="房價分析">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="top">
  <div class="brand">房價分析</div>
  <div id="search-wrap">
    <form id="search" autocomplete="off">
      <span class="search-lens" aria-hidden="true">🔍</span>
      <input id="q" type="search" enterkeyhint="search" placeholder="搜尋地址、路名、行政區、學區或地標..." aria-autocomplete="list" aria-controls="search-sug">
      <button type="button" id="btn-clear" class="btn-clear" aria-label="清除" hidden title="清除">✕</button>
      <button type="submit" id="btn-submit" aria-label="搜尋">搜尋</button>
    </form>
    <div id="search-sug" class="search-dropdown" hidden></div>
  </div>
  <button id="btn-menu" class="icon" aria-label="設定與圖層" title="設定與圖層">☰</button>
</header>

<main id="app">
  <div id="map-wrap">
    <canvas id="map" aria-label="3D 房價地圖"></canvas>
    <div id="chips" class="floating">
      <div class="seg" id="seg-cat" role="radiogroup" aria-label="房型"></div>
      <div class="seg" id="seg-metric" role="radiogroup" aria-label="柱高"></div>
    </div>
    <div id="map-tools" class="floating">
      <button data-act="home" title="全市">全市</button>
      <button data-act="zin" title="放大">＋</button>
      <button data-act="zout" title="縮小">－</button>
      <button data-act="rotl" title="左轉">↺</button>
      <button data-act="rotr" title="右轉">↻</button>
      <button data-act="tilt" title="俯視／斜看">⤢</button>
      <button data-act="share" title="分享目前的畫面（縣市、區域、房型、分頁）">分享</button>
    </div>
    <div id="legend" class="floating" hidden></div>
    <div id="attrib"></div>
    <div id="map-tooltip" hidden></div>
    <div id="toast" hidden></div>
  </div>

  <section id="sheet" aria-label="資訊面板">
    <div id="sheet-handle" aria-hidden="true"><span></span></div>
    <div id="sheet-head">
      <div class="title-row">
        <h1 id="d-name">台南市</h1>
        <div class="head-btns">
          <button id="btn-nation" class="small" hidden>全台</button>
          <button id="btn-city" class="small">全市</button>
        </div>
      </div>
      <div id="d-sub" class="muted"></div>
      <div id="kpis"></div>
    </div>
    <nav id="tabs" role="tablist"></nav>
    <div id="tab-body"></div>
  </section>

  <div id="menu" class="popover" hidden>
    <div class="pop-head"><b>設定與圖層</b><button class="icon" data-close>✕</button></div>
    <div class="pop-body" id="menu-body"></div>
  </div>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
